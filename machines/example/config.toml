# The runner's config.toml, copied into the machine on the first `up` only —
# after that `yad connect` and `yad account add` write to the machine's copy,
# and it is the one that counts. ARCHITECTURE.md §4 describes every key.

name     = "example"
labels   = ["linux", "example"]
capacity = 2

[harness.claude]
cap = 2
# The accounts this machine runs on. Listed here, each is reported as
# needs_login — to `yad-machine status` and to every hub — until someone logs
# it in with `yad-machine login`, so a new machine says what it is missing
# instead of failing its first run.
accounts = ["main"]

[harness.codex]
cap = 1
