# The runner's config.toml. Every `up` brings the machine's copy onto this one:
# every setting here wins, and one left out goes back to the default — but the
# machine keeps its hub connections, and an account listed there and not here
# (logged in at the machine, or added by a hub) is kept too. ARCHITECTURE.md §4
# describes every key.

name     = "example"
labels   = ["linux", "example"]
capacity = 2

[harness.claude]
cap = 2
# The accounts this machine runs on. Listed here, each is reported as
# needs_login — to `yad-machine status` and to every hub — until someone logs
# it in with `yad-machine login`, so a new machine says what it is missing
# instead of failing its first run. Taking one off this list does not remove
# it from the machine: `yad account remove` there, or from a hub, does.
accounts = ["main"]

[harness.codex]
cap = 1

# Self-update: the runner follows new releases by itself, at a moment it holds
# no run. Off unless turned on here; refused with a pinned YAD_VERSION, and it
# gives the yad binary to the runner's user (README.md, "Updating itself").
#[update]
#auto = true
