name: CI

on:
  push:
    branches: [master]
  pull_request:

# CI is deliberately a subset. Its one advantage over the machine this is
# written on is that it is a clean Linux box, so it runs what can answer
# differently there — vet, a build, the suite — and, for the breaking-change
# check and the freshness of the documents it reads, two things that do not.
#
# gofmt, staticcheck, sqlc drift and the cross-compile matrix give
# the same answer anywhere; CHECKS.md makes `make check` the bar before a pull
# request, and that is where they run.
#
# The exception is `make check-breaking`, and the reason is not that it answers
# differently here — it does not. It is that it is the only check in this
# repository whose failure lands on somebody else: a renamed or deleted field
# in a released OpenAPI document breaks hubs generated from it, on machines
# nobody here can reach. Every other check protects the person who ran it, and
# skipping one costs that person an hour. `make check` is still the bar, and
# `make check` still cannot bind a contributor who never read CHECKS.md. So
# this one runs in both places on purpose.
#
# `make check-openapi` goes with it: the breaking check reads the committed
# documents, so a Go type changed without `make generate` would leave it
# comparing a stale file with the last release and finding nothing. It is the
# OpenAPI half of check-generated and needs no sqlc.
#
# There is no sqlc step any more: it existed only for check-generated, whose
# sqlc half is now local. If sqlc output is stale, `make check` says so before
# the branch is ever pushed.
jobs:
  ci:
    # The self-hosted runner on the Mac mini `ashikaga`: Linux arm64 in a Colima
    # VM, one ephemeral runner per job with its own Docker daemon (gpi-tools
    # ci-runners/). GitHub-hosted minutes on this account are budget-capped.
    # release.yml stays on ubuntu-latest: it runs rarely and builds for amd64.
    runs-on: [self-hosted, ashikaga]
    steps:
      - uses: actions/checkout@v5
        with:
          # The breaking-change check compares each document against itself at
          # the last release tag, and checkout fetches no tags by default. With
          # a shallow clone it would find no baseline, print that it is inert
          # and exit 0 — green on every run, a gate only on the laptop. This
          # line is what makes the step above a real check; release.yml sets it
          # for the same family of reason.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make ci
