info:
  description: The protocol between a YAD runner and a hub. Runners call out; hubs never call in. Paths are relative to the connection's base URL.
  title: YAD runner protocol
  version: 1.0.0
openapi: 3.1.0
paths:
  /runners/register:
    post:
      description: Called once by `yad connect`, with the one-time registration token as the bearer. The token is dead afterwards. Registering a runner id the hub already knows needs a token issued for that runner, and replaces its credential; the old one stops working. With a token for a new runner it is refused with 409.
      operationId: register
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - runner: []
      summary: Exchange a registration token for a runner credential
  /runners/{runner}/deregister:
    post:
      description: "Runs the runner still holds become lost on the hub's side; runs offered to it and never claimed go back in the queue. Every session bound to that runner closes, and the runs still queued in them fail: a session is resumable only on the runner that holds it, so a run left in one would be offerable to no runner at all. The binding is never cleared instead — the session's state is on that machine. The credential stops working at once. The runner's id and its history stay, so registering again with a token issued for that runner brings it back, with new sessions."
      operationId: deregister
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The runner id.
          in: path
          name: runner
          required: true
          schema:
            description: The runner id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - runner: []
      summary: Retire this runner's credential
  /runners/{runner}/sync:
    post:
      description: Every run listed is claimed or has its lease renewed. A run offered in the previous response and not listed here was never received and will be offered again. A listed run this runner does not hold — never offered to it, offered to another, or already finished or lost — is answered with a cancel control for that run.
      operationId: sync
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The runner id.
          in: path
          name: runner
          required: true
          schema:
            description: The runner id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - runner: []
      summary: Heartbeat, lease renewal, health and the ask for work, in one call
  /runs/{run}/events:
    post:
      description: "Idempotent by (run, seq): a resent event is ignored and the first copy stands. The response's acked_through is the highest seq up to which the hub holds every event, and is authoritative; the runner resends everything after it. Only the runner the run was claimed by may append, before or after it ends; any other gets 403 not_holder."
      operationId: appendEvents
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAck"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - runner: []
      summary: Append a batch of run events
  /runs/{run}/result:
    post:
      description: "Retried from the runner's outbox until acknowledged, and applied at most once: the same state again is acknowledged. 409 means the hub already holds a different terminal state — lost, when the lease lapsed first — which stands; the runner stops reporting. Only the runner the run was offered to or claimed by may report; any other gets 403 not_holder."
      operationId: submitResult
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Result"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - runner: []
      summary: Report a run's terminal state
servers:
  - description: where `yad hub` mounts it; other hubs choose their own base
    url: /v1
