# Code generated by internal/hub/cmd/openapigen from protocol/v1. DO NOT EDIT.
# Regenerate with `make generate`.
components:
  schemas:
    AccountReport:
      additionalProperties: true
      properties:
        label:
          description: The owner's name for the account, such as work. Not a secret, and not the identity it is signed in as.
          type: string
        limited_until:
          description: When a limited account's usage limit resets. Absent for an account that is not limited.
          format: date-time
          type: string
        models:
          description: "The models the harness listed for this account's login, in its own order: what to offer a run on this account. Not a limit: a run may name any model, and the harness decides whether it exists. Absent when the harness has not listed them for it — the account needs login, or the harness did not answer — and the harness's models are then the runner's best answer."
          items:
            type: string
          type: array
        silent_until:
          description: "Set while the account's last runs said nothing at all before the runner's first-output timeout stopped them, three or more in a row each ending harness_silent: the runner starts no run on it until this time, whatever its state says, and then offers it again. A run on it that produces any output clears it. Absent otherwise, and from runners older than this field."
          format: date-time
          type: string
        state:
          description: "free takes runs, unless silent_until is set. limited is at a usage limit until limited_until. needs_login cannot run a turn until the owner logs it in again, at the machine or with a hub login (start_login or login_token). Absent from runners older than this field: the runner cannot say, which is not a fault."
          enum:
            - free
            - limited
            - needs_login
          type: string
        windows:
          description: Every usage window the harness last reported for this account, whether or not it is at a limit, so a hub sees an account running low before it runs out. As fresh as the last turn that ran on it. Absent means no run has heard a window yet, never that the account has no limits.
          items:
            $ref: "#/components/schemas/AccountWindow"
          type: array
      required:
        - label
      type: object
    AccountWindow:
      additionalProperties: true
      properties:
        name:
          description: "The window as its harness names it: five_hour or seven_day for Claude, primary or secondary for Codex."
          type: string
        resets_at:
          description: When the window refills, if the harness said.
          format: date-time
          type: string
        used_percent:
          description: How much of the window is used, 0-100.
          format: double
          type: number
      required:
        - name
        - used_percent
      type: object
    Ack:
      additionalProperties: true
      properties:
        ok:
          description: Always true. The object exists so a hub can add fields later.
          type: boolean
      required:
        - ok
      type: object
    Brief:
      additionalProperties: true
      properties:
        context:
          description: "Standing background for this run, continuing runs included: appended to Claude's system prompt, and Codex's developer instructions. It outlasts a compaction, and it is this run's, not the session's — send it whole on every run of the session."
          type: string
        instruction:
          description: "The run's one user message: what to do. Required."
          type: string
      required:
        - instruction
      type: object
    Capabilities:
      additionalProperties: true
      properties:
        arch:
          description: "The CPU architecture as Go names it: amd64 or arm64."
          type: string
        capacity:
          $ref: "#/components/schemas/Capacity"
          description: "How many runs the runner executes at once, and the owner's per-harness caps. The configured size, not what is free now: that is each sync's health.free_capacity."
        harnesses:
          description: Every harness in the runner's catalog, installed or not. A run may be offered only for a harness whose kind is first-class, present is true and error is empty.
          items:
            $ref: "#/components/schemas/HarnessReport"
          type: array
        host_tools:
          description: The non-harness tools a run may need, as they exist on this runner. A tool is usable when present is true and error is empty, and, for a tool that has a login, when logged_in is true as well. A tool that is missing or broken is reported rather than left out.
          items:
            $ref: "#/components/schemas/HostTool"
          type: array
        instructions:
          description: "true: this runner's owner has given every run on it standing instructions, which the runner appends to each run's context after brief.context, under a heading of its own, whichever hub sent the run. Their text is the owner's and is never sent. Absent: none are set. Never sent as false."
          type: boolean
        labels:
          description: Free-form routing strings the owner attached, such as linux, gpu or work. The runner never interprets them; a hub may route on them.
          items:
            type: string
          type: array
        name:
          description: "A name for people: the owner's choice, or the machine's hostname. For display only; two runners may share one."
          type: string
        observed_at:
          description: When the runner built this document. Left out of the fingerprint, so it changes without the fingerprint moving.
          format: date-time
          type: string
        os:
          description: "The operating system as Go names it: linux or darwin."
          type: string
        path_sources:
          description: "false: this runner's owner has switched sources on the machine off, so a run with a path source, or a git source whose url is a path or file:// URL, fails with source_refused. Offer a run opening a session (session.new) with one to another runner; a run in a session already bound to this runner can go nowhere else, so offer it, and the refusal names the setting. Absent: the runner takes them inside the directories its owner allows. Never sent as true."
          type: boolean
        protocol_features:
          description: "The protocol features beyond the v1 baseline this runner acts on: start_at, steer, interrupt, drain, close_session, effort, fork, release, login, accounts, harness_features and source_probe; live_sessions is reserved. steer, interrupt, effort, fork and release are per-run features, which the harness a run targets decides: listed here only while every harness this runner can drive — first-class, present, no error — supports them, and not at all while it can drive none, so they change with the harnesses installed, and the fingerprint with them; and, beside harness_features, in each harness's own features, which are then the answer for runs on that harness. accounts is per hub: a runner lists it only to a hub its owner lets add and remove accounts, and only beside login, so two hubs of one runner may be sent different lists and fingerprints. release is per hub as well: a runner whose owner has turned release off for a hub lists it to that hub nowhere, runner-wide or in any harness's features. A hub uses none that is not listed here, because nothing acknowledges a control and an ignored one looks exactly like an obeyed one. Ignore strings you do not know."
          items:
            type: string
          type: array
        runner_id:
          description: "The runner's stable id: random, written once to its profile, and the same at every hub it registers with. It is the {runner} in the sync and deregister paths. Not a secret."
          type: string
        yad_version:
          description: "The yad build: v0.4.0, v0.4.0-4-gabc1234 for a build four commits after it, or dev for an unstamped one. What a hub's min_version is compared against."
          type: string
      required:
        - runner_id
        - name
        - yad_version
        - os
        - arch
        - harnesses
        - capacity
        - observed_at
      type: object
    Capacity:
      additionalProperties: true
      properties:
        by_harness:
          additionalProperties:
            format: int64
            type: integer
          description: "Per-harness bounds by harness id, each applying independently of total. A harness missing from the map is bounded by total alone: the map carries only the caps the owner set, and is absent when there are none."
          type: object
        total:
          description: Runs in all, across every harness.
          format: int64
          type: integer
      required:
        - total
      type: object
    ClosedSession:
      additionalProperties: true
      properties:
        closed_at:
          description: When the runner closed it.
          format: date-time
          type: string
        reason:
          description: "closed: the hub asked, with close_session. closed_by_owner: the runner's owner closed it on the machine. expired: nothing ran in it for the owner's idle TTL. disk_pressure: the disk under the workdirs ran low and it was among the longest idle. Each means the same for routing: a new run needs a new session. A closed set for all of v1: a value outside it goes only to a hub that advertised, in hub_features, the feature adding it."
          enum:
            - closed
            - closed_by_owner
            - expired
            - disk_pressure
          type: string
        session_id:
          description: The session, by the id the hub gave it.
          type: string
      required:
        - session_id
        - reason
        - closed_at
      type: object
    Control:
      additionalProperties: true
      properties:
        account:
          description: "The account label, for start_login, login_token and remove_account. Without add, one the runner already lists; with add, a new one: lowercase letters, digits, dashes and underscores, starting with a letter or digit, at most 64. Absent in start_login logs in the harness's own default login; login_token, add and remove_account need one."
          type: string
        add:
          description: "For start_login and login_token: create the account named in account, listing it on the runner once its login takes. A login that does not take lists nothing. A label the runner already lists ends the login failed; log it in again without add. Sent only to a runner advertising accounts."
          type: boolean
        code:
          description: "For login_code: what the owner got after signing in at the login's url. A secret: never log it or show it again."
          type: string
        discard_local:
          description: "For release_session: release the session even though its workdir holds work its remote does not have — changes not committed, or commits not pushed — which is then lost. Without it the runner refuses such a release with local_changes or unpushed_commits, and nothing changes; have a run in the session commit and push first."
          type: boolean
        harness:
          description: "The harness, for start_login, login_token and remove_account: claude or codex. Codex logs in by device code, and never by token."
          type: string
        kind:
          description: "cancel: end the run. interrupt: end the run's current turn and keep its session. steer: add text to the running turn. close_session: close the session and reclaim its workdir. drain: take no new runs and exit once the held ones end. report_capabilities: send the capability document in the next sync. update: reserved, never sent. start_login: log an account in by link, reporting the URL in logins (and for Codex the user_code to type there). login_code: the code the owner got at that URL, never for a login reporting user_code. login_token: store a token as the account's login. cancel_login: end a login. remove_account: take the account named by harness and account off the runner. release_session: hand the session back to the hub, so its next run can go to another runner. close_session and drain go only to a runner advertising the feature of the same name; interrupt and steer only to one advertising it for the harness of the run they name — in that harness's features when protocol_features lists harness_features; the four login kinds only to one advertising login; remove_account, and start_login or login_token carrying add, only to one advertising accounts; release_session only to one advertising release for the session's harness — in that harness's features when protocol_features lists harness_features. A closed set for all of v1: a kind outside it goes only to a runner that advertised, in protocol_features, the feature adding it."
          type: string
          x-extensible-enum:
            - cancel
            - interrupt
            - steer
            - close_session
            - drain
            - report_capabilities
            - update
            - start_login
            - login_code
            - login_token
            - cancel_login
            - remove_account
            - release_session
        login_id:
          description: "The login, for start_login, login_code, login_token and cancel_login: chosen by the hub, unique on it, 1-128 letters, digits, dots, dashes or underscores."
          type: string
        run_id:
          description: The run, for cancel, interrupt and steer.
          type: string
        session_id:
          description: The session, for close_session and release_session.
          type: string
        text:
          description: What to tell the harness, for steer.
          type: string
        token:
          description: "For login_token: a claude setup-token token. A secret that works for a year: never log it, never return it from any API, and hold it only until a sync from the runner reports this login."
          type: string
      required:
        - kind
      type: object
    DeregisterRequest:
      additionalProperties: true
      properties:
        reason:
          description: "Why the runner is leaving, in its own words, for the hub to show beside the runs it settles. Untrusted text: store it bounded and printable."
          type: string
      type: object
    Error:
      additionalProperties: true
      properties:
        code:
          description: "What went wrong, for a program to act on. v1 names ten codes: not_implemented, unauthorized, runner_revoked, version_too_old, conflict, not_found, invalid, unsupported_protocol, not_holder and internal. They are not a closed set: a client meeting a code it does not know acts on the HTTP status and shows message and next_action to a person."
          type: string
        message:
          description: What went wrong, for a person.
          type: string
        next_action:
          description: "What the reader should do about it, for a person: the runner's owner reads it on their machine. Required on every error."
          type: string
      required:
        - code
        - message
        - next_action
      type: object
    ErrorResponse:
      additionalProperties: true
      properties:
        error:
          $ref: "#/components/schemas/Error"
          description: What went wrong. Every error response under the base carries this envelope, and next_action is always set.
      required:
        - error
      type: object
    Event:
      additionalProperties: true
      properties:
        at:
          description: When it happened on the runner.
          format: date-time
          type: string
        error:
          $ref: "#/components/schemas/RunError"
          description: For an error event.
        kind:
          description: "text: the harness said something (text). thinking: its reasoning (text). tool_call: it called a tool (tool.id, tool.name, tool.input). tool_result: the tool answered (tool.id, tool.output). status: a phase of the run, for people (status, text). usage: tokens one model used (usage). error: something went wrong, whether or not the run carries on (error). A closed set for all of v1: a value outside it goes only to a hub that advertised, in hub_features, the feature adding it."
          enum:
            - text
            - thinking
            - tool_call
            - tool_result
            - status
            - usage
            - error
          type: string
        seq:
          description: "The event's place in its run: 1 for the first, then 2, 3, and so on with no gaps. (run, seq) identifies an event; a resent one keeps its seq."
          format: int64
          type: integer
        status:
          description: "For a status event, a short label of the phase, such as account, waiting, cancelling or steered. For display: not a closed set, and not to be parsed."
          type: string
        text:
          description: The words of a text or thinking event, and the detail of some status events. At most 1 MiB. An error event carries its words in error.message instead.
          type: string
        tool:
          $ref: "#/components/schemas/ToolEvent"
          description: For tool_call and tool_result.
        usage:
          $ref: "#/components/schemas/Usage"
          description: For a usage event.
      required:
        - seq
        - at
        - kind
      type: object
    EventAck:
      additionalProperties: true
      properties:
        acked_through:
          description: "The highest seq such that the hub holds every event of the run from 1 up to and including it, with no gap: 0 when it holds none, or none from 1 on. The runner resends everything after it, so never answer a seq you have not stored contiguously."
          format: int64
          type: integer
      required:
        - acked_through
      type: object
    EventBatch:
      additionalProperties: true
      properties:
        events:
          description: Events of this run in seq order. A yad runner sends at most 100 in a batch; yad hub takes up to 1000 and refuses more. A batch may repeat events already sent.
          items:
            $ref: "#/components/schemas/Event"
          type: array
      required:
        - events
      type: object
    GitSource:
      additionalProperties: true
      properties:
        base:
          description: "The ref a new branch is cut from. Absent: the repository's default branch."
          type: string
        branch:
          description: "The branch the run works on, checked out as a worktree of the repository, fast-forwarded to the remote's when the runner already has it behind. One session has it at a time: a session lets go of it when a run of it ends with the branch committed and pushed to origin, and takes it back at its next run; until then a run of another session naming it fails with class source_failed. Absent: yad/<connection>/<session>, named after the session, which no other session takes."
          type: string
        url:
          description: "The repository: an https or ssh URL, fetched with the machine's own credentials and never with a password in the URL, or an absolute path or file:// URL of a repository on the runner's machine, inside the directories its owner allows and never at a runner whose capability document says path_sources is false. Required."
          type: string
      required:
        - url
      type: object
    Grant:
      additionalProperties: true
      properties:
        as:
          description: "env: set as the variable name=value in the harness's environment. file: written to a 0600 file named name outside the workdir, whose path the harness reads from the variable name."
          type: string
          x-extensible-enum:
            - env
            - file
        name:
          description: "An environment variable name, [A-Za-z_][A-Za-z0-9_]*, which is also the file name for a file grant. Not PATH, HOME, USER or LOGNAME, nor a name beginning LD_ or DYLD_, nor one that picks a harness's credential or home — the whole list: ANTHROPIC_AUTH_TOKEN, ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_PROFILE, ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_CONFIG_DIR, CLAUDE_CONFIG_DIR, CLAUDE_SECURESTORAGE_CONFIG_DIR, ANTHROPIC_BASE_URL, ANTHROPIC_CUSTOM_HEADERS, any name beginning CLAUDE_CODE_USE_, CODEX_HOME, OPENAI_API_KEY, CODEX_API_KEY, CODEX_ACCESS_TOKEN, OPENAI_BASE_URL, CODEX_REFRESH_TOKEN_URL_OVERRIDE and AWS_BEARER_TOKEN_BEDROCK, whatever the run's harness. Every name is matched in any case. No two grants may share a name, and no two file grants may differ only by case."
          type: string
        value:
          description: The secret. Never logged or shown; a hub should keep it only until the run is terminal.
          type: string
      required:
        - name
        - value
        - as
      type: object
    HarnessHealth:
      additionalProperties: true
      properties:
        accounts:
          description: Each account's state, limit and usage windows as of this sync.
          items:
            $ref: "#/components/schemas/AccountReport"
          type: array
        id:
          description: The harness id.
          type: string
        ready:
          description: "Whether the harness can take a run now: at least one account is free and not silent, or it has no accounts and runs on its own login, which is not silent."
          type: boolean
        silent_until:
          description: "For a harness with no accounts, running on its own login: set while that login's last runs said nothing at all before the runner's first-output timeout stopped them, three or more in a row each ending harness_silent. ready is false until this time, and then the harness is offered again. A run that produces any output clears it. Absent otherwise, for a harness with accounts (each account says it for itself), and from runners older than this field."
          format: date-time
          type: string
      required:
        - id
        - ready
      type: object
    HarnessReport:
      additionalProperties: true
      properties:
        accounts:
          description: The owner's accounts for this harness. Absent when none are configured, and the harness runs on its own login.
          items:
            $ref: "#/components/schemas/AccountReport"
          type: array
        error:
          description: "Why this harness cannot take runs, and the next action for whoever owns the machine. Written by the runner: it never quotes what the harness printed and never names a path on the machine."
          type: string
        features:
          description: "The per-run features a run on this harness may use: steer, interrupt, effort, fork and release. Read it only when protocol_features lists harness_features: then it is the whole answer for runs on this harness, in place of those five runner-wide strings, and absent means none. Without harness_features, go by the runner-wide strings. Ignore strings you do not know."
          items:
            type: string
          type: array
        id:
          description: "The id a run names in its harness field: claude, codex, gemini, copilot, opencode or cursor."
          type: string
        kind:
          description: "first-class: the runner has an adapter for it and can run it. recognised: detected and reported so the gap is visible, and never the target of a run."
          enum:
            - first-class
            - recognised
          type: string
        label:
          description: The harness's display name, such as Claude Code.
          type: string
        models:
          description: "Models the harness offers on this runner, such as opus or gpt-5.5, in the harness's own order: every model offered to any login a run may use, once. Where the logins differ, each account's models say what its own is offered. Not a limit: a run may name any model, and the harness decides whether it exists. Absent when the runner knows none."
          items:
            type: string
          type: array
        models_source:
          description: "Where models came from. harness: the harness listed them for the logins a run may use — asked without spending a token or, for a Codex that could not be asked, read from the list Codex keeps of its own last answer. catalog: the harness could not be asked or did not answer, and models is the runner's own fixed list for it, which may name a model the login is not offered or miss one it is. Absent when models is, and from runners older than this field."
          enum:
            - harness
            - catalog
          type: string
        present:
          description: "There is a binary the runner starts for this harness's runs. Not that it works: a present harness with an error cannot take runs. A harness absent with an error has a path configured for it that names nothing and none on the runner's PATH either."
          type: boolean
        version:
          description: The version number the harness reported, such as 2.4.1 or 1.0.0-beta.12, and nothing else of what it printed. Absent when it printed no version.
          type: string
        warnings:
          description: "What is wrong with a harness the runner can still drive, each with the next action for whoever owns the machine: a path configured for it that names nothing, so the one on PATH is used; a Codex whose protocol differs from the one the runner was built against. Never a reason to refuse runs. Written by the runner: it never quotes what the harness printed and never names a path on the machine."
          items:
            type: string
          type: array
      required:
        - id
        - label
        - kind
        - present
      type: object
    Health:
      additionalProperties: true
      properties:
        disk_free_bytes:
          description: "Free bytes on the disk under the runner's workdirs. For dashboards: absent is 0 or unknown, and a hub never refuses a sync for its absence."
          format: int64
          type: integer
        draining:
          description: The runner has stopped claiming and exits once the runs it holds have ended. It keeps syncing until then; offer it nothing. The answer to a drain control, which stops repeating once this is true.
          type: boolean
        free_capacity:
          $ref: "#/components/schemas/Capacity"
          description: "What this sync may be offered, already net of every run the runner holds: total bounds the whole response, and each by_harness figure bounds that harness independently. Offer up to it as sent; do not subtract the runs listed beside it."
        harnesses:
          description: "Readiness of each harness the runner can drive, with its accounts. A harness with ready false is not claimed for: an offer for it comes back unlisted."
          items:
            $ref: "#/components/schemas/HarnessHealth"
          type: array
        load:
          description: "The machine's one-minute load average, as uptime(1) prints it: the whole machine's, not divided by CPU count. For dashboards: absent is 0, or a machine the runner cannot read one from, and a hub never refuses a sync for its absence."
          format: double
          type: number
        outbox_depth:
          description: "Results the runner holds that this hub has not acknowledged. For dashboards: absent is 0 or unknown, and a hub never refuses a sync for its absence."
          format: int64
          type: integer
        recent_errors:
          description: "The runner's recent warnings and errors, newest first, each '<RFC3339 time> <LEVEL> <message>'. The runner's own words: never what a harness printed, never a path on the machine, never a credential. Capped in number, age and length."
          items:
            type: string
          type: array
        spool_depth:
          description: "Events the runner holds that this hub has not acknowledged. For dashboards: absent is 0 or unknown, and a hub never refuses a sync for its absence."
          format: int64
          type: integer
      required:
        - free_capacity
      type: object
    HeldRun:
      additionalProperties: true
      properties:
        reason:
          description: Why the run is in this state, in the runner's words, for display. Not a closed set.
          type: string
        resumes_at:
          description: "For a waiting run, the earliest moment it continues: the soonest reset among its harness's accounts. It may continue sooner if an account frees."
          format: date-time
          type: string
        run_id:
          description: The run.
          type: string
        state:
          description: "Where the run is. A run whose result is written but not yet acknowledged stays listed as running, so its lease outlasts a hub outage. A closed set for all of v1: a value outside it goes only to a hub that advertised, in hub_features, the feature adding it."
          enum:
            - claimed
            - preparing
            - running
            - waiting
          type: string
      required:
        - run_id
        - state
      type: object
    HostTool:
      additionalProperties: true
      properties:
        error:
          description: "What is wrong with this tool on the runner: a path configured for it that names nothing with none on PATH either, a probe that timed out, a binary that would not run, a Docker daemon that is not answering. May accompany present: false, when a configured path names nothing and PATH has no such tool. Carries the next action. A runner with one still registers."
          type: string
        id:
          description: "The tool: git, gh, docker or browser. browser is a browser a run can drive headless: Google Chrome, Chromium, or the browsers Playwright installed; kind says which. Present means one was found; no display is checked for. Ignore ids you do not know."
          type: string
        kind:
          description: "For browser only: which was found. chrome: Google Chrome. chromium: Chromium. playwright: browsers Playwright installed in its cache, and no Chrome or Chromium installed; version is then its newest Chromium's when the runner could read it. When a machine has several, the first of chrome, chromium and playwright is reported. Absent for every other tool, and for a browser not present. An open set: treat a kind you do not know as a browser that is there."
          type: string
        logged_in:
          description: Whether the tool is signed in. Absent for a tool with no login, and for one whose login state the runner could not find out, where error says why.
          type: boolean
        login_hosts:
          description: Every host the tool is signed in to, such as github.com or a GitHub Enterprise hostname; a gh signed in to two reports both. Never the account it is signed in as.
          items:
            type: string
          type: array
        present:
          description: "The runner found a binary for this tool and probed it: the one its configured path names, or the one on PATH when that path names nothing. For browser, which has no configured path: a Chrome or Chromium on PATH or at its standard install location, or a browser Playwright finished installing in its cache. Present is not usable: see error and logged_in."
          type: boolean
        version:
          description: The version number the tool reported, such as 2.51.0, and nothing else of what it printed. For browser, the browser's own, such as 141.0.7390.65. Absent when the tool printed none, and for a browser whose version could not be read.
          type: string
        warnings:
          description: "What is wrong with a tool the runner can still use, each with the next action for whoever owns the machine: a path configured for it that names nothing, so the one on PATH is used. Never a reason to treat the tool as unusable. Written by the runner: it never quotes what the tool printed and never names a path on the machine."
          items:
            type: string
          type: array
      required:
        - id
        - present
      type: object
    LoginReport:
      additionalProperties: true
      properties:
        account:
          description: The account label, as start_login or login_token named it. Absent for the harness's own default login, and when the runner never had this login.
          type: string
        error:
          description: Why a login failed, expired or was cancelled, in the runner's words, with the next action. Never a path on the machine, never a credential.
          type: string
        harness:
          description: "The harness being logged in. Absent only when the runner never had this login: the answer to a login_code or cancel_login for an id it does not know."
          type: string
        login_id:
          description: The login, by the id the hub gave it in start_login or login_token.
          type: string
        method:
          description: "link: the runner ran the harness's own login and reports its URL. token: the runner stored a token the hub delivered. Absent only when the runner never had this login. A closed set for all of v1."
          enum:
            - link
            - token
          type: string
        state:
          description: "starting: taken, and not yet waiting. waiting: url (and for a device-code harness user_code) is ready; send the code with login_code, unless user_code is set: then the owner types user_code at url, and no code is sent. checking: the code or token is in, or the device code was entered, and the runner is asking the harness whether it took. succeeded: the harness's own check says the account is logged in, and it takes runs. failed: it did not take, and error says why. expired: no code arrived, or the device code was not entered, within the runner's limit (ten minutes for yad). cancelled: ended by cancel_login, or by a newer login for the same account. The last four are terminal. A closed set for all of v1."
          enum:
            - starting
            - waiting
            - checking
            - succeeded
            - failed
            - expired
            - cancelled
          type: string
        updated_at:
          description: When the login last changed state, by the runner's clock.
          format: date-time
          type: string
        url:
          description: "Where the owner signs in, while waiting: the harness's own authorize URL, as it printed it. Show it; never follow it. Absent until waiting, and for a token login."
          type: string
        user_code:
          description: "For a device-code login — Codex's — while waiting: the code the owner types at url. Show it beside url; nothing comes back through the hub, so send no login_code for a login that has one. Absent for Claude, whose login instead waits for login_code."
          type: string
      required:
        - login_id
        - state
        - updated_at
      type: object
    Metrics:
      additionalProperties: true
      properties:
        account_switches:
          description: How many turns of this run started on a different account than the turn before them. Counted by what a move costs rather than by what caused it, so a run resumed onto a different account after waiting counts the same as one a failover moved. A run parked five times and resumed on the same account each time reports 0; a run that goes A to B and back to A reports 2. The cost is expected to be one cache-cold turn, because prompt caches are documented as isolated per account -- but no cross-account resume has been measured, so that price is inferred rather than observed.
          format: int64
          type: integer
        api_retries:
          description: Transient throttling the harness retried by itself, across every turn. A usage limit is not one of these.
          format: int64
          type: integer
        cancel_latency_ms:
          description: From a cancel or interrupt arriving to the turn ending. Absent when nothing asked the run to stop.
          format: int64
          type: integer
        duration_ms:
          description: "How long the run took, from the moment it first reached preparing. For a run reported lost this is a floor rather than an end anybody observed: nothing watched the run stop, so it is measured to the last moment the runner is known to have been alive for it, and the real duration is that or more. A lost run's other figures are likewise only what the runner had durably recorded: its counters and usage cover every turn that ended before the runner stopped, and account_switches every move it made, but not the turn it stopped during, whose usage the harness never reported. A zero there is what was recorded rather than proof that nothing happened."
          format: int64
          type: integer
        first_event_ms:
          description: How long the harness took to say anything, measured from the start of the turn that answered rather than from the start of the run. A run parked on a usage limit and then answering at once is not a slow harness, and the wait is reported separately as waited_ms.
          format: int64
          type: integer
        left_running:
          description: "How many processes the run's tool work still had running when a turn ended on the harness's own answer -- a test suite, a dev server, anything backgrounded -- whoever stopped them after. A succeeded run with this above zero may be hollow: its final text can promise work that died with the turn. Absent means not measured (every turn was cancelled, interrupted or stopped by a watchdog, or the process table could not be read), which is not the same as 0, measured with nothing found. Summed over the turns measured. The runner names them, by process name only, in a status event labelled left_running before the result. A process whose shell backgrounded it and then exited is out of the runner's sight and not counted."
          format: int64
          type: integer
        stalls:
          description: Times a watchdog found the event stream idle, across every turn.
          format: int64
          type: integer
        tool_calls:
          description: Tool calls across every turn of the run.
          format: int64
          type: integer
        waited_ms:
          description: "How long the run spent waiting for a free account, summed over every wait rather than the longest or the last: a run may be parked, resumed, limited again and parked again. This total is also what the run's max_wait_ms is judged against. For a run reported lost while it was parked it is a floor, as duration_ms is."
          format: int64
          type: integer
      required:
        - duration_ms
        - first_event_ms
        - tool_calls
        - api_retries
        - stalls
        - account_switches
      type: object
    ProbeSource:
      additionalProperties: true
      properties:
        ref:
          description: "The ref to ask the remote for, as git ls-remote matches a pattern: a branch, a tag or a full ref name. Absent: HEAD, the repository's default branch."
          type: string
        url:
          description: "The repository, as a git source's url names it: an https or ssh URL, or an absolute path or file:// URL on the runner's machine. Never with a credential in it — an https URL with userinfo, or an ssh URL with a password — nor with a query or a fragment, which the runner refuses unprobed and answers with error refused. Each URL at most once."
          type: string
      required:
        - url
      type: object
    RegisterRequest:
      additionalProperties: true
      properties:
        capabilities:
          $ref: "#/components/schemas/Capabilities"
          description: "The runner's capability document. Keep it: it says what the runner can take until a sync carries a newer one."
      required:
        - capabilities
      type: object
    RegisterResponse:
      additionalProperties: true
      properties:
        archive_max_bytes:
          description: "The largest session archive this hub takes, in bytes. A runner refuses to release a session whose archive is larger (archive_too_large) and keeps it open. Sync answers carry it too, and the latest one heard wins. Absent: the hub names none, and refuses one too large with 413."
          format: int64
          type: integer
        hub_features:
          description: Features this hub has beyond the v1 baseline. v1 defines none, and a hub that sends none is complete. A value v1 adds to one of its enums later is sent only to a hub advertising the feature that adds it.
          items:
            type: string
          type: array
        lease_ms:
          description: "The lease the hub will name in its sync answers: how long a run offered to this runner, or held by it, is kept for it without a sync. Never shorter than sync_interval_ms."
          format: int64
          type: integer
        min_version:
          description: The oldest yad this hub takes, such as 0.4.0, compared on the release core alone. Absent is no floor.
          type: string
        runner_credential:
          description: The secret the runner sends as its bearer on every later call. Issued here and nowhere else; keep only what recognises it, such as a hash.
          type: string
        sync_interval_ms:
          description: Milliseconds until the runner's next sync, 5000 to 60000 inclusive. A runner clamps a value outside that range and adds its own jitter.
          format: int64
          type: integer
      required:
        - runner_credential
        - sync_interval_ms
        - lease_ms
      type: object
    ReleaseError:
      additionalProperties: true
      properties:
        code:
          description: "Why, for a program: local_changes (the workdir holds work not committed), unpushed_commits (its branch holds commits the remote does not), path_source (a source is a directory on the runner's machine, which no other runner has), no_conversation (no run of the session has started a conversation yet), not_releasable (this runner cannot release a session of its harness, or its owner has turned release off for this hub), archive_too_large (the archive is past the hub's archive_max_bytes), upload_refused (the hub refused the archive), session_unknown (the runner holds no such session for this hub), session_closed (the session was closed on the runner), or export_failed (the conversation could not be read on the runner). Not a closed set: show one you do not know."
          type: string
        message:
          description: What happened, for a person.
          type: string
        next_action:
          description: "What to do about it, for a person: commit and push the work with a run in the session, send the release again with discard_local, or start a new session."
          type: string
      required:
        - code
        - message
        - next_action
      type: object
    ReleasedSession:
      additionalProperties: true
      properties:
        archive:
          $ref: "#/components/schemas/SessionArchive"
          description: "Set when the session was released: the archive this runner uploaded, which the hub must hold with this sha256. The runner has closed the session and keeps nothing of it; offer the session's next run as opening it (session.new true) with this archive in session.archive, to a runner advertising release for its harness. Absent when error is set."
        error:
          $ref: "#/components/schemas/ReleaseError"
          description: "Set when the runner did not release the session: it stays open on this runner exactly as it was, and its runs go on here. Absent when archive is set."
        released_at:
          description: "When the runner settled the release: when the hub answered the archive's upload with a 2xx, or when the runner refused it."
          format: date-time
          type: string
        session_id:
          description: The session, by the id the hub gave it.
          type: string
      required:
        - session_id
        - released_at
      type: object
    Result:
      additionalProperties: true
      properties:
        error:
          $ref: "#/components/schemas/RunError"
          description: Why the run did not succeed. A failed result with class refused is the runner declining a run, usually one it was offered and never claimed; it may come for a claimed run too, and is applied as any terminal state. A refused run is not offered again.
        final_text:
          description: The harness's last answer, at most 1 MiB.
          type: string
        last_seq:
          description: The seq of the run's last event, 0 when it had none. The run's event stream is complete once acked_through reaches it.
          format: int64
          type: integer
        metrics:
          $ref: "#/components/schemas/Metrics"
          description: "How the run went: duration, time to first event, tool calls, retries, stalls, waits and account switches."
        state:
          description: "How the run ended. lost here is the runner's own report of a run a previous process held and could not finish. A closed set for all of v1: a value outside it goes only to a hub that advertised, in hub_features, the feature adding it."
          enum:
            - succeeded
            - failed
            - cancelled
            - timed_out
            - lost
          type: string
        usage:
          $ref: "#/components/schemas/RunUsage"
          description: Tokens the whole run used, by model.
      required:
        - state
        - usage
        - metrics
        - last_seq
      type: object
    Run:
      additionalProperties: true
      properties:
        brief:
          $ref: "#/components/schemas/Brief"
          description: What the run is told.
        effort:
          description: "How hard the harness thinks, in the harness's own terms, as model is: low, medium, high, xhigh or max for Claude Code; for Codex, one of the reasoning levels its model lists, such as low, medium, high or xhigh; for OpenCode, one of the effort variants its model has. Not a closed set, and the runner checks no name: a level the harness does not take fails the run with the harness's own error. It must still look like a level — at most 64 bytes of letters, digits, - and _ — or the run is refused whole. Absent: the harness's default. Offer a run carrying one only to a runner advertising effort for its harness: in that harness's features when protocol_features lists harness_features, and in protocol_features otherwise."
          type: string
        grants:
          description: Short-lived secrets for this run alone, delivered to the harness process and deleted when the run ends. Names follow rules the schema cannot state; a run breaking one is refused whole.
          items:
            $ref: "#/components/schemas/Grant"
          type: array
        harness:
          description: "The harness to run, by its id in the capability document: claude, codex or opencode today. Offer a run only to a runner whose document shows this harness first-class, present and without an error."
          type: string
        inactivity_ms:
          description: "Stop the run when the harness emits no event for this many milliseconds; it ends timed_out with class inactivity_timeout. It can only lower the owner's own timeout (30 minutes unless they changed it), never raise it. Absent or 0: the owner's. Until the harness's first event a shorter timeout of the owner's applies as well (2 minutes unless they changed it); a harness that emits nothing within it ends timed_out with class harness_silent."
          format: int64
          type: integer
        max_wait_ms:
          description: "The most milliseconds the run may spend waiting for a free account, summed over every wait. Past it the run ends timed_out with error class max_wait_exceeded. Absent or 0: no cap."
          format: int64
          type: integer
        model:
          description: "The model the harness runs, in the harness's own terms: an alias such as haiku or a full name such as claude-haiku-4-5 or gpt-5.1-codex. Required; the runner never falls back to a default."
          type: string
        run_id:
          description: The run's id, chosen by the hub and unique within it. It is the {run} in the events and result paths, and a runner never runs the same id twice.
          type: string
        session:
          $ref: "#/components/schemas/SessionRef"
          description: The session the run belongs to.
        sources:
          description: "What the session's workdir is built from, used by the run that opens the session; a run continuing it names the same sources or none. Absent: the workdir starts empty. Each source sets exactly one of git, a repository checked out as a worktree, or path, an absolute directory on the runner's machine worked in place, taken only inside the directories its owner allows (their home unless they listed others), never at a runner whose capability document says path_sources is false, and otherwise failed with class source_refused."
          items:
            $ref: "#/components/schemas/Source"
          type: array
        start_at:
          description: A moment the run must not start before, once. While it is ahead, offer the run only to a runner advertising start_at, which claims it and holds it; once it has passed, any runner may take it.
          format: date-time
          type: string
        wall_clock_ms:
          description: "The most milliseconds the harness may run, summed over the run's turns and not counting waits. Past it the run is stopped and ends timed_out with class wall_clock_timeout. Absent or 0: no cap."
          format: int64
          type: integer
      required:
        - run_id
        - session
        - harness
        - model
        - brief
      type: object
    RunError:
      additionalProperties: true
      properties:
        class:
          description: "What kind of failure, for a program to act on: refused, session_closed, resume_rejected, usage_limit, prompt_too_long, source_refused, setup_failed, inactivity_timeout, harness_silent and others. Not a closed set: a class you do not know is a failure to show, not to parse."
          type: string
        message:
          description: What happened, for a person. At most 1 MiB.
          type: string
      required:
        - class
        - message
      type: object
    RunUsage:
      additionalProperties: true
      properties:
        by_model:
          additionalProperties:
            $ref: "#/components/schemas/Usage"
          description: Tokens for the whole run, every turn and every account, by model.
          type: object
      type: object
    SessionArchive:
      additionalProperties: true
      properties:
        bytes:
          description: The archive's size in bytes.
          format: int64
          type: integer
        sha256:
          description: The SHA-256 of the archive's bytes, as 64 lower-case hex digits. A runner fetching it refuses an archive that does not hash to this.
          type: string
      required:
        - sha256
        - bytes
      type: object
    SessionRef:
      additionalProperties: true
      properties:
        archive:
          $ref: "#/components/schemas/SessionArchive"
          description: "Only with new true, and never beside fork_from: open this session from the session archive its last runner uploaded when it released it, continuing that conversation under the same session id. The runner fetches it with GET /sessions/{session}/archive, refuses one that does not hash to sha256, and fails the run with class archive_rejected when it cannot take it. Offer the run only to a runner advertising release for the run's harness — in that harness's features when protocol_features lists harness_features. A source naming no branch is checked out on the branch the session's last runner worked on. Absent: the session starts as any new one does."
        fork_from:
          description: "Only with new true: open this session as a fork of the session named here — a new conversation that starts from a copy of that session's, as far as the harness has written it, and diverges from there, while the session forked goes on unchanged. Offer the run only to the runner that holds that session, and only while it advertises fork for the run's harness — in that harness's features when protocol_features lists harness_features; the runner refuses it (class refused) for a session it does not hold for this hub, of another harness, or closed or closing. The fork gets its own workdir from its own sources, as any new session does; nothing of the forked session's workdir comes with it. Absent: the session starts with an empty conversation."
          type: string
        id:
          description: The session's id, chosen by the hub. A session lives on the runner that claimed its first run and is continued only there, until the hub releases it and a run opens it from its archive on another runner.
          type: string
        mode:
          description: "per_run, the default: a fresh harness process for each run, resuming the session's conversation. live is reserved: offer it only to a runner advertising live_sessions, which none does yet."
          type: string
          x-extensible-enum:
            - per_run
            - live
        new:
          description: true for the run that opens the session, false for every later run. A runner refuses new true for a session id it already has, and new false for one it does not hold.
          type: boolean
      required:
        - id
        - new
      type: object
    Source:
      additionalProperties: true
      oneOf:
        - properties:
            git:
              $ref: "#/components/schemas/GitSource"
          required:
            - git
          type: object
        - properties:
            path:
              type: string
          required:
            - path
          type: object
      properties:
        git:
          $ref: "#/components/schemas/GitSource"
        path:
          type: string
      type: object
    SourceReach:
      additionalProperties: true
      properties:
        checked_at:
          description: When the runner checked. A runner checks a reachable repository again at least every 30 minutes and an unreachable one at least every 5, and at once when a hub first lists it.
          format: date-time
          type: string
        error:
          description: "Why reachable is false, as a class — never git's own words, which can quote a URL holding a credential. auth: the remote refused or asked for a credential this runner does not have. not_found: no repository at the URL; GitHub answers this way too for a private repository the credential cannot see. ref_not_found: the repository answered, and has no such ref — every runner will say the same, so it is no reason to route elsewhere. network: the host could not be resolved or reached. timeout: git did not finish in 20 seconds. refused: the runner would not probe the URL — it carries a credential, a query or a fragment, is not a URL a git source may name, or is on the machine where its owner does not allow sources. failed: git failed some other way, or could not be started. Absent when reachable is true. A closed set for all of v1: a value outside it goes only to a hub that advertised, in hub_features, the feature adding it."
          enum:
            - auth
            - not_found
            - ref_not_found
            - network
            - timeout
            - refused
            - failed
          type: string
        reachable:
          description: Whether git ls-remote, run on this runner with the environment and credentials a run's git uses, found the ref at the URL.
          type: boolean
        url:
          description: The repository, exactly as the hub listed it in probe_sources.
          type: string
      required:
        - url
        - reachable
        - checked_at
      type: object
    SyncRequest:
      additionalProperties: true
      properties:
        capabilities:
          $ref: "#/components/schemas/Capabilities"
          description: The full capability document, sent on the first sync of every runner process, after the fingerprint moves, and after a report_capabilities control. When present it replaces the one you hold. Its runner_id is the path's; a sync whose document names another runner is refused as invalid.
        closed_sessions:
          description: Sessions this runner has closed, each repeated in every sync until one carrying it is answered with a 2xx. Record them by session id, take a repeat as the same news, stop offering runs in them, and end the runs still queued in them. A runner advertising close_session reports every close here; a close from one that does not is believed all the same.
          items:
            $ref: "#/components/schemas/ClosedSession"
          type: array
        fingerprint:
          description: An opaque hash of the runner's capability document. Compare it with the one that came with the document you hold; when it differs and capabilities is absent, answer with a report_capabilities control.
          type: string
        health:
          $ref: "#/components/schemas/Health"
          description: "The runner's state for routing and alerting, computed fresh for this sync: free capacity, per-harness readiness, disk, load, what it owes this hub, recent errors, and whether it is draining."
        logins:
          description: The hub logins this runner has from this hub, each repeated in every sync until one carrying its terminal state is answered with a 2xx. Record them by login_id and take a repeat as the same news. A login the runner reported, not yet terminal, that a later sync leaves out is gone — the runner restarted, and a login in flight does not survive that — so end it failed. A report for a login_id you never started is news you may ignore. Sent by runners advertising the login feature.
          items:
            $ref: "#/components/schemas/LoginReport"
          type: array
        released_sessions:
          description: "Each release_session this runner has settled, either way, repeated in every sync until one carrying it is answered with a 2xx: released, with the archive the hub must hold, or refused, with an error, the session staying open here. Record them by session id, take a repeat as the same news, and stop sending release_session for one reported here. A report for a session you did not ask to release, or one bound to another runner, changes nothing. Sent by runners advertising the release feature."
          items:
            $ref: "#/components/schemas/ReleasedSession"
          type: array
        runner_id:
          description: "The runner's id: the same as the {runner} in the path, or the sync is refused."
          type: string
        runs:
          description: Every run the runner holds. Listing a run offered in the previous response claims it; listing a claimed run renews its lease. An offered run left out was never received, and goes back in the queue at this sync. A listed run the runner does not hold is answered with a cancel control for it. Each run is listed at most once; a hub handed two listings of one run may apply either.
          items:
            $ref: "#/components/schemas/HeldRun"
          type: array
        source_reach:
          description: "The runner's answers about the repositories this hub listed in probe_sources, one per URL: each sent when it is new or differs from the last one this hub answered with a 2xx, and again at least every 30 minutes, so an answer left out is unchanged, not withdrawn. Keep the latest per runner and URL; drop it when you stop listing the URL. An answer for a URL you do not list is news you may ignore. Sent by runners advertising the source_probe feature."
          items:
            $ref: "#/components/schemas/SourceReach"
          type: array
      required:
        - runner_id
        - fingerprint
        - health
      type: object
    SyncResponse:
      additionalProperties: true
      properties:
        archive_max_bytes:
          description: "The largest session archive this hub takes, in bytes, as in the register response; the latest one a runner heard is the one it goes by. Absent: the hub names none, and refuses one too large with 413."
          format: int64
          type: integer
        controls:
          description: "Instructions for the runner. Nothing acknowledges one: cancel and interrupt are repeated in every response while the run is listed, drain until health says draining, close_session until the session is in closed_sessions, remove_account until neither the capability document nor health lists the account, release_session until the session is in released_sessions; a steer is sent once."
          items:
            $ref: "#/components/schemas/Control"
          type: array
        lease_ms:
          description: "How long the hub holds each run named in this answer for this runner without hearing from it, measured on the hub from when it handled this sync: every run offered here, and every run the request listed. A listed run the lease lapses on is lost, except a claim the hub has asked to cancel, which ends cancelled: the runner may have withdrawn it unstarted. An offered run the lease lapses on, never claimed, goes back in the queue and may be offered to any runner; a claim listed after that is answered with a cancel. Never shorter than next_sync_ms."
          format: int64
          type: integer
        min_version:
          description: The oldest yad this hub takes, as in the register response. Absent is no floor.
          type: string
        next_sync_ms:
          description: "Milliseconds until the next sync, 3000 to 60000 inclusive: 5000 or more as the hub's steady interval, and less only while the hub holds a queued run this runner would be offered once a run it holds ends. A runner clamps a value outside that range, adds its own jitter, and syncs sooner when this response offered runs."
          format: int64
          type: integer
        probe_sources:
          description: "The repositories this hub may send this runner, for it to check it can reach with its own credentials and answer in source_reach. The whole list in every answer: a URL left out is no longer asked about, and absent asks about none. At most 64 distinct URLs count; a runner probes the first 64 and ignores the rest. Send it only to a runner advertising source_probe."
          items:
            $ref: "#/components/schemas/ProbeSource"
          type: array
        runs:
          description: "New runs offered. Not claimed yet: a run is claimed when the next sync lists it. Never more than the request's free_capacity, in total or for any harness."
          items:
            $ref: "#/components/schemas/Run"
          type: array
      required:
        - next_sync_ms
        - lease_ms
      type: object
    ToolEvent:
      additionalProperties: true
      properties:
        exit_code:
          description: "For a tool_result of a shell command, its exit status, where the harness reports one as a number: Codex does, Claude Code does not. Absent otherwise."
          format: int64
          type: integer
        id:
          description: The harness's id for the call, which joins a tool_result to its tool_call.
          type: string
        input:
          description: The call's input, usually JSON, at most 8 KiB.
          type: string
        is_error:
          description: "For a tool_result: whether the call failed, as the harness reported it — true for a command that exited non-zero, a tool that reported an error, or a call the owner's approval policy declined; false for one that succeeded. Absent when the harness did not say; never guessed from the output."
          type: boolean
        name:
          description: The tool, as the harness names it, such as Read or shell.
          type: string
        output:
          description: The tool's output, at most 8 KiB.
          type: string
        truncated:
          description: Input or output was cut to fit 8 KiB.
          type: boolean
      required:
        - id
      type: object
    Usage:
      additionalProperties: true
      properties:
        cache_read:
          description: Input tokens read from the prompt cache.
          format: int64
          type: integer
        cache_write:
          description: Input tokens written to the prompt cache.
          format: int64
          type: integer
        cost_usd:
          description: The harness's own cost estimate in US dollars, where it gives one (Claude Code does, Codex does not). Never computed by yad, and absent rather than zero when unknown.
          format: double
          type: number
        input:
          description: Input tokens not read from a cache.
          format: int64
          type: integer
        model:
          description: The model the tokens were spent on, as the harness reported it.
          type: string
        output:
          description: Output tokens.
          format: int64
          type: integer
      required:
        - input
        - output
      type: object
  securitySchemes:
    runner:
      description: The runner credential; the registration token on register only.
      scheme: bearer
      type: http
info:
  description: The protocol between a YAD runner and a hub. Runners call out; hubs never call in. Paths are relative to the connection's base URL.
  title: YAD runner protocol
  version: 1.0.0
openapi: 3.1.0
paths:
  /runners/register:
    post:
      description: Called once by `yad connect`, with the one-time registration token as the bearer. The token is dead afterwards. Registering a runner id the hub already knows needs a token issued for that runner, and replaces its credential; the old one stops working. With a token for a new runner it is refused with 409.
      operationId: register
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Any other error, in the same envelope: 404 not_found for a path that is no operation, 405 invalid for a method an operation does not have."
      security:
        - runner: []
      summary: Exchange a registration token for a runner credential
  /runners/{runner}/deregister:
    post:
      description: "Runs the runner still holds become lost on the hub's side, but for a claim the hub was asked to cancel, which ends cancelled; runs offered to it and never claimed go back in the queue. Every session bound to that runner closes, and the runs still queued in them fail: a session is resumable only on the runner that holds it, so a run left in one would be offerable to no runner at all. The binding is never cleared instead — the session's state is on that machine. The credential stops working at once. The runner's id and its history stay, so registering again with a token issued for that runner brings it back, with new sessions."
      operationId: deregister
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The runner id.
          in: path
          name: runner
          required: true
          schema:
            description: The runner id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Any other error, in the same envelope: 404 not_found for a path that is no operation, 405 invalid for a method an operation does not have."
      security:
        - runner: []
      summary: Retire this runner's credential
  /runners/{runner}/sync:
    post:
      description: "Every run listed is claimed or has its lease renewed. A run offered in the previous response and not listed here was never received: it goes back in the queue at this sync, and may be offered again in this answer. An offer carries the same lease_ms as a claim: one not claimed within it goes back in the queue, for this runner or any other, and a claim listed after that is refused with a cancel, as a lapsed claim is. A listed run this runner does not hold — never offered to it, offered to another, or already finished or lost — is answered with a cancel control for that run. A claim the hub was asked to cancel that a sync leaves out was withdrawn by the runner, which heard the cancel before any answer confirmed the claim; it ends cancelled, as it does when its lease lapses, not lost. A runner that does not sync for longer than the hub's abandon-after (yad hub: 24 h, --abandon-after) has every session bound to it closed and the runs queued in them ended, and keeps its credential: its next sync is answered normally, with close_session for each of those sessions until it reports the close."
      operationId: sync
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The runner id.
          in: path
          name: runner
          required: true
          schema:
            description: The runner id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Any other error, in the same envelope: 404 not_found for a path that is no operation, 405 invalid for a method an operation does not have."
      security:
        - runner: []
      summary: Heartbeat, lease renewal, health and the ask for work, in one call
  /runs/{run}/events:
    post:
      description: "Idempotent by (run, seq): a resent event is ignored and the first copy stands. The response's acked_through is the highest seq up to which the hub holds every event, and is authoritative; the runner resends everything after it. Only the runner the run was claimed by may append, before or after it ends; any other gets 403 not_holder."
      operationId: appendEvents
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAck"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Any other error, in the same envelope: 404 not_found for a path that is no operation, 405 invalid for a method an operation does not have."
      security:
        - runner: []
      summary: Append a batch of run events
  /runs/{run}/result:
    post:
      description: "Retried from the runner's outbox until acknowledged, and applied at most once: the same state again is acknowledged. 409 means the hub already holds a different terminal state — lost, when the lease lapsed first — which stands; the runner stops reporting. Only the runner the run is offered to — until a sync takes the offer back — or the runner that claimed it may report; any other gets 403 not_holder. A failed result with class refused from the runner a run is offered to is how it declines the run, which then is not offered again."
      operationId: submitResult
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Result"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Any other error, in the same envelope: 404 not_found for a path that is no operation, 405 invalid for a method an operation does not have."
      security:
        - runner: []
      summary: Report a run's terminal state
  /sessions/{session}/archive:
    get:
      description: Answered only to the runner a run of the session is offered to, or the runner the session is bound to, while the hub holds the archive its last runner released it with — the run carrying session.archive. The runner checks the bytes against that run's session.archive.sha256. 403 not_holder for any other runner; 404 not_found when the hub holds no released archive for the session.
      operationId: getSessionArchive
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The session id.
          in: path
          name: session
          required: true
          schema:
            description: The session id.
            type: string
      responses:
        "200":
          content:
            application/gzip:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: OK
          headers:
            Content-Type:
              schema:
                description: application/gzip.
                type: string
            Yad-Archive-Sha256:
              schema:
                description: The SHA-256 of the body, as 64 lower-case hex digits.
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Any other error, in the same envelope: 404 not_found for a path that is no operation, 405 invalid for a method an operation does not have."
      security:
        - runner: []
      summary: Fetch the archive a released session opens from
    put:
      description: "Sent by the runner a session is bound to, while a release of it is asked for (the release_session control), before it reports the release in released_sessions. The body is the session archive, opaque to the hub: store it as it is. An upload of the same bytes again is answered as the first was; one of other bytes replaces it. 403 not_holder for a runner the session is not bound to, 409 conflict for a session no release of which is asked for, 413 for an archive past the hub's archive_max_bytes, which the runner reports as archive_too_large and keeps the session."
      operationId: putSessionArchive
      parameters:
        - description: The protocol major version.
          in: header
          name: Yad-Protocol
          required: true
          schema:
            description: The protocol major version.
            enum:
              - "1"
            type: string
        - description: The session id.
          in: path
          name: session
          required: true
          schema:
            description: The session id.
            type: string
        - description: The SHA-256 of the body, as 64 lower-case hex digits. A body that does not hash to it is refused as invalid.
          in: header
          name: Yad-Archive-Sha256
          required: true
          schema:
            description: The SHA-256 of the body, as 64 lower-case hex digits. A body that does not hash to it is refused as invalid.
            pattern: ^[0-9a-f]{64}$
            type: string
      requestBody:
        content:
          application/gzip:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionArchive"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "426":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Upgrade Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Any other error, in the same envelope: 404 not_found for a path that is no operation, 405 invalid for a method an operation does not have."
      security:
        - runner: []
      summary: Upload the archive of a session this runner is releasing
servers:
  - description: where `yad hub` mounts it; other hubs choose their own base
    url: /v1
