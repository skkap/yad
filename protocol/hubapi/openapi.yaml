info:
  description: "How a service or a person submits runs to a standalone `yad hub` and follows them. Not the runner protocol: hubs that embed the protocol never implement this. Paths are relative to /api/v1."
  title: YAD hub service API
  version: 1.0.0
openapi: 3.1.0
paths:
  /runs:
    post:
      description: Answers with the queued run. Submitting a run_id the hub already has gives the same answer, with the run as it is now, when the content is the same — a safe retry — and 409 when it differs.
      operationId: submitRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - admin: []
      summary: Queue a run
  /runs/{run}:
    get:
      operationId: getRun
      parameters:
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - admin: []
      summary: Read a run's state, and its result once it has one
  /runs/{run}/events:
    get:
      description: Answers at once with every event after `after` (up to a page), or when the run's state moves, or when it finishes; otherwise holds the request up to wait_ms and answers with no events. Ask again with after = next_after until done, which is true once the run is terminal and every event it will have has been returned.
      operationId: runEvents
      parameters:
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
        - description: Return events with a seq above this; 0 for the first page.
          explode: false
          in: query
          name: after
          schema:
            description: Return events with a seq above this; 0 for the first page.
            format: int64
            minimum: 0
            type: integer
        - description: How long to hold the request open when there is nothing new; at most 50000. 0 answers at once.
          explode: false
          in: query
          name: wait_ms
          schema:
            default: 25000
            description: How long to hold the request open when there is nothing new; at most 50000. 0 answers at once.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - admin: []
      summary: Long-poll a run's events
