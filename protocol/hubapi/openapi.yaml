          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - admin: []
      summary: Read a run's state, and its result once it has one
  /runs/{run}/cancel:
    post:
      description: "A run no runner has started — queued, or offered and not yet claimed — is cancelled here and now. A run a runner holds is cancelled by that runner at its next sync, down the cancel ladder: the harness is interrupted, then its process group gets SIGTERM, then SIGKILL; cancel_requested_at is set until then, and the result's cancel_latency_ms says how long the harness took to stop. A harness that finished before the cancel reached it keeps its own result. Cancelling a cancelled run answers it as it is; any other finished run is 409."
      operationId: cancelRun
      parameters:
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - admin: []
      summary: Cancel a run
  /runs/{run}/events:
    get:
      description: Answers at once with every event after `after` (up to a page), or when the run's state moves or a cancel is asked for it, or when it finishes; otherwise holds the request up to wait_ms and answers with no events. Ask again with after = next_after until done, which is true once the run is terminal and every event it will have has been returned.
      operationId: runEvents
      parameters:
        - description: The run id.
          in: path
          name: run
          required: true
          schema:
            description: The run id.
            type: string
        - description: Return events with a seq above this; 0 for the first page.
          explode: false
          in: query
          name: after
          schema:
            description: Return events with a seq above this; 0 for the first page.
            format: int64
            minimum: 0
            type: integer
        - description: How long to hold the request open when there is nothing new; at most 50000. 0 answers at once.
          explode: false
          in: query
          name: wait_ms
          schema:
            default: 25000
            description: How long to hold the request open when there is nothing new; at most 50000. 0 answers at once.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
