  /sessions/{session}/close:
    post:
      description: "The session takes no new run, and its runner deletes its workdir. A session no runner holds yet closes here and now, and its runs that have not started are cancelled. One a runner holds is closing until that runner says it is done, which it does at a sync once no run of the session is held there — a run in it finishes first. Closing a closed session answers it as it is. A runner that does not advertise the close_session feature is 409: it would ignore the control."
