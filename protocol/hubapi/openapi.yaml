              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
        - admin: []
      summary: Long-poll a run's events
  /runs/{run}/interrupt:
    post:
      description: "Ends the harness's current turn and keeps its session, so the next run in the session resumes it; the run ends cancelled unless the turn finished first. Delivered at the runner's next sync. Unlike a cancel it asks only: a harness that ignores it keeps going. A run that has not started is 409 — cancel it instead."
