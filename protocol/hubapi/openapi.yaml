      summary: Interrupt a run's turn
  /runs/{run}/steer:
    post:
      description: "Delivered once, at the runner's next sync. The harness reads it at its next tool boundary, or answers it after the turn in the same run. A steer the harness would not take appears in the run's events as an error with class steer_failed. A run that has not started is 409: put the text in the brief of a new run instead. So is a run held by a runner that does not advertise the steer feature: it would ignore the control, and the text would be lost."
