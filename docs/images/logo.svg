<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 128" width="312" height="128" role="img" aria-labelledby="t">
  <title id="t">YAD</title>
  <style>
    .mark { fill: #E8522F; }
    .glyph { fill: none; stroke: #FFFFFF; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .word { fill: none; stroke: #1F2328; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .word { stroke: #F0F3F6; }
    }
  </style>
  <!-- The mark: a prompt whose tip leaves the machine, outbound and never in,
       and reads as a y. -->
  <rect class="mark" x="4" y="20" width="88" height="88" rx="22"/>
  <polyline class="glyph" points="24,50 44,70 24,90"/>
  <line class="glyph" x1="44" y1="70" x2="70" y2="44"/>
  <polyline class="glyph" points="54,42 70,44 72,60"/>
  <!-- yad, drawn as strokes so it renders the same without any font. -->
  <g class="word" transform="translate(120 0)">
    <line x1="0" y1="42" x2="22" y2="86"/>
    <line x1="44" y1="42" x2="11" y2="108"/>
    <circle cx="90" cy="64" r="22"/>
    <line x1="112" y1="42" x2="112" y2="86"/>
    <circle cx="158" cy="64" r="22"/>
    <line x1="180" y1="18" x2="180" y2="86"/>
  </g>
</svg>
