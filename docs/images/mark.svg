<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="t">
  <title id="t">YAD</title>
  <!-- A prompt whose tip leaves the machine, outbound and never in, and reads
       as a y. Kept to three strokes so it holds at favicon size. -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="#E8522F"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="24,34 44,54 24,74"/>
    <line x1="44" y1="54" x2="70" y2="28"/>
    <polyline points="54,26 70,28 72,44"/>
  </g>
</svg>
